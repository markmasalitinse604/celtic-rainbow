<!doctype html>
<html lang="{{htmlLang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{chooseTitle}} | {{brandFull}}</title>
  <meta name="description" content="{{chooseHint}}">
  <link rel="icon" href="../../assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&amp;family=Overpass:wght@600;800&amp;display=swap">
  <link rel="stylesheet" href="../../shared/tokens.css">
  <link rel="stylesheet" href="../../choose-assets/choose.css">
  <link rel="stylesheet" href="../../shared/hud.css">
  <!-- Уже выбрали транспорт (?vehicle=truck|bus в адресе) — экран выбора пропускаем -->
  <script>(function(){var v=new URLSearchParams(location.search).get('vehicle');if(v==='truck'||v==='bus')location.replace('../?vehicle='+v);})();</script>
</head>
<body>

{{icons}}

<!-- Шапка (HUD): общая с главной, собирает renderHeader() в build.js -->
{{header}}

<!-- data-sounds подставляет build.js: только те mp3, что реально лежат в src/choose/media/ -->
<main class="choose" id="choose" data-next="../" data-sounds="{}">

  <!-- Одна сцена, 5 слоёв друг над другом. Два набора кадров: горизонтальный (ПК, планшет и телефон боком)
       и вертикальный (телефон в портрете, max-aspect-ratio: 4/5). Нижний слой выбирает браузер (<picture>),
       остальные choose.js догружает из data-h / data-v под текущую ориентацию. -->
  <div class="scene" id="scene">
    <picture>
      <source media="(max-aspect-ratio: 4/5)" sizes="max(100vw, 56.5vh)"
        srcset="../../choose-assets/img/choose-v-both-1080.webp 1080w, ../../choose-assets/img/choose-v-both-1536.webp 1536w">
      <img class="layer is-on" data-layer="both" alt="{{chooseTruck}} · {{chooseBus}}"
        srcset="../../choose-assets/img/choose-both-1600.webp 1600w, ../../choose-assets/img/choose-both-2720.webp 2720w"
        sizes="max(100vw, 177vh)" src="../../choose-assets/img/choose-both-1600.webp" fetchpriority="high" decoding="async">
    </picture>
    <img class="layer" data-layer="truck" alt="" aria-hidden="true"
      data-h="../../choose-assets/img/choose-truck-1600.webp 1600w, ../../choose-assets/img/choose-truck-2720.webp 2720w"
      data-v="../../choose-assets/img/choose-v-truck-1080.webp 1080w, ../../choose-assets/img/choose-v-truck-1536.webp 1536w">
    <img class="layer" data-layer="bus" alt="" aria-hidden="true"
      data-h="../../choose-assets/img/choose-bus-1600.webp 1600w, ../../choose-assets/img/choose-bus-2720.webp 2720w"
      data-v="../../choose-assets/img/choose-v-bus-1080.webp 1080w, ../../choose-assets/img/choose-v-bus-1536.webp 1536w">
    <img class="layer" data-layer="truck-lit" alt="" aria-hidden="true"
      data-h="../../choose-assets/img/choose-truck-lit-1600.webp 1600w, ../../choose-assets/img/choose-truck-lit-2720.webp 2720w"
      data-v="../../choose-assets/img/choose-v-truck-lit-1080.webp 1080w, ../../choose-assets/img/choose-v-truck-lit-1536.webp 1536w">
    <img class="layer" data-layer="bus-lit" alt="" aria-hidden="true"
      data-h="../../choose-assets/img/choose-bus-lit-1600.webp 1600w, ../../choose-assets/img/choose-bus-lit-2720.webp 2720w"
      data-v="../../choose-assets/img/choose-v-bus-lit-1080.webp 1080w, ../../choose-assets/img/choose-v-bus-lit-1536.webp 1536w">

    <!-- Кнопки ровно над машинами: размер и место задаёт choose.js по рамкам машин -->
    <div class="zones">
      <button type="button" class="zone zone--truck" data-side="truck" aria-label="{{chooseTruck}}, {{chooseCatC}}"></button>
      <button type="button" class="zone zone--bus" data-side="bus" aria-label="{{chooseBus}}, {{chooseCatD}}"></button>
    </div>
  </div>

  <div class="shade" aria-hidden="true"></div>

  <div class="heading">
    <p class="heading__hint">{{chooseHint}}</p>
    <h1 class="heading__title">{{chooseTitle}}</h1>
  </div>

  <!-- Подписи машин: один общий ряд (--labels-y), каждая по центру под своей машиной (--x у подписи) -->
  <div class="labels" aria-hidden="true">
    <span class="label" data-side="truck"><span class="label__name">{{chooseTruck}}</span><span class="label__sep">·</span><span class="label__cat">{{chooseCatC}}</span></span>
    <span class="label" data-side="bus"><span class="label__name">{{chooseBus}}</span><span class="label__sep">·</span><span class="label__cat">{{chooseCatD}}</span></span>
  </div>

  <a class="skip" href="../">{{chooseSkip}} <svg class="hud__icon" aria-hidden="true"><use href="#i-down"></use></svg></a>

  <div class="blackout" aria-hidden="true"></div>
</main>

<!-- Подсказка про звук: пузырь под кнопкой на ПК, всплывающая плашка над нижней панелью на телефоне -->
<div class="sound-tip" id="sound-tip" role="status" hidden>
  <svg class="hud__icon" aria-hidden="true"><use href="#i-mute"></use></svg><span>{{soundTip}}</span>
</div>

<!-- Нижняя панель на телефоне: общая с главной (renderDock в build.js) -->
{{dock}}

<script src="../../shared/hud.js" defer></script>
<script src="../../shared/sound.js" defer></script>
<script src="../../choose-assets/choose.js" defer></script>
</body>
</html>
