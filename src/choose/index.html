<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Что хочешь водить? | Celtic Rainbow Truck &amp; Bus School</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/favicon.png">
  <link rel="stylesheet" href="choose.css">
</head>
<body>

<!-- data-sounds подставляет build.js: только те mp3, что реально лежат в src/choose/media/ -->
<main class="choose" id="choose" data-next="../ru/" data-sounds="{}">

  <!-- Одна сцена, 5 слоёв друг над другом. Два набора кадров: горизонтальный (ПК, планшет и телефон боком)
       и вертикальный (телефон в портрете, max-aspect-ratio: 4/5). Нижний слой выбирает браузер (<picture>),
       остальные choose.js догружает из data-h / data-v под текущую ориентацию. -->
  <div class="scene" id="scene">
    <picture>
      <source media="(max-aspect-ratio: 4/5)" sizes="max(100vw, 56.5vh)"
        srcset="img/choose-v-both-1080.webp 1080w, img/choose-v-both-1536.webp 1536w">
      <img class="layer is-on" data-layer="both" alt="Фура и автобус стоят рядом на горной дороге"
        srcset="img/choose-both-1600.webp 1600w, img/choose-both-2720.webp 2720w"
        sizes="max(100vw, 177vh)" src="img/choose-both-1600.webp" fetchpriority="high" decoding="async">
    </picture>
    <img class="layer" data-layer="truck" alt="" aria-hidden="true"
      data-h="img/choose-truck-1600.webp 1600w, img/choose-truck-2720.webp 2720w"
      data-v="img/choose-v-truck-1080.webp 1080w, img/choose-v-truck-1536.webp 1536w">
    <img class="layer" data-layer="bus" alt="" aria-hidden="true"
      data-h="img/choose-bus-1600.webp 1600w, img/choose-bus-2720.webp 2720w"
      data-v="img/choose-v-bus-1080.webp 1080w, img/choose-v-bus-1536.webp 1536w">
    <img class="layer" data-layer="truck-lit" alt="" aria-hidden="true"
      data-h="img/choose-truck-lit-1600.webp 1600w, img/choose-truck-lit-2720.webp 2720w"
      data-v="img/choose-v-truck-lit-1080.webp 1080w, img/choose-v-truck-lit-1536.webp 1536w">
    <img class="layer" data-layer="bus-lit" alt="" aria-hidden="true"
      data-h="img/choose-bus-lit-1600.webp 1600w, img/choose-bus-lit-2720.webp 2720w"
      data-v="img/choose-v-bus-lit-1080.webp 1080w, img/choose-v-bus-lit-1536.webp 1536w">

    <!-- Кнопки ровно над машинами: размер и место задаёт choose.js по рамкам BOXES -->
    <div class="zones">
      <button type="button" class="zone zone--truck" data-side="truck">
        <span class="label">Грузовик<span class="label__cat"><span class="label__dot"> · </span>категория C</span></span>
      </button>
      <button type="button" class="zone zone--bus" data-side="bus">
        <span class="label">Автобус<span class="label__cat"><span class="label__dot"> · </span>категория D</span></span>
      </button>
    </div>
  </div>

  <h1 class="title">Что хочешь водить?</h1>
  <div class="blackout" aria-hidden="true"></div>
</main>

<script src="choose.js" defer></script>
</body>
</html>
