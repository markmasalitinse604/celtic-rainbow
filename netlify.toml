[build]
  command = "npm run build"
  publish = "dist"
# Кадры ролика: браузер держит их сутки — экран выбора заранее кладёт первые кадры в кэш,
# и главная берёт их без повторных запросов. Перенарезали кадры — меняется ?v=<хэш> в ссылках
# (FRAMES_V в build.js), и браузер сразу берёт новые.
[[headers]]
  for = "/assets/ride/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/ride-bus/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
